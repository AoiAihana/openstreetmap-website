# =============================================================================
# minecraft:* 标签的 iD 元素预设（**唯一手写源文件**）
# =============================================================================
#
# 这个文件把本项目自定义的 minecraft:* 标签整理成 iD 编辑器里可以点选的
# 「元素预设」，按「杂项 / 自然类 / 基建类 / 生产类 / 红石类」五类分组。
#
# 它不是给 iD 直接读的：iD 只认 `presets.min.json` / `fields.min.json` /
# `preset_categories.min.json` / `preset_defaults.min.json` 那套 id-tagging-schema
# 格式。本文件由
#
#     scripts/build_id_minecraft_presets.rb build
#
# 和「基础 schema」合并（不是替换！iD 原有 1700+ 个预设一个都不能少）之后，
# 生成产物到 config/id_minecraft/，再由 IdPresetsController 在 /id/... 上伺服，
# 最后通过 app/views/site/id.html.erb 的 asset map 顶掉 iD 默认去 CDN 取的那几个文件。
#
# 详细原理与操作步骤见 README-ID-PRESETS.md。
#
# -----------------------------------------------------------------------------
# 内容来源（不自己发明键值）
# -----------------------------------------------------------------------------
#   1. ../carto之后的计划.txt           —— 键/值/中文名/几何/辅助键的规范
#   2. ../osm-carto4mc/style/minecraft*.mss
#      ../osm-carto4mc/project.mml      —— 样式表真正渲染了哪些键值、用什么图层（点/线/面）
#      ../osm-carto4mc/docs/minecraft-stylesheet.md、minecraft-placeholders.md
#
# 计划里写明「不参与 carto4mc 渲染」的键（minecraft=yes、minecraft:addon、
# minecraft:species、minecraft:genus、minecraft:ore_vein、minecraft:sport、
# minecraft:product、minecraft:conveyor、minecraft:signal_wired）**照样做预设**——
# 它们仍然可以被编辑，只是不出图。
#
# -----------------------------------------------------------------------------
# 几何（geometry）怎么定的
# -----------------------------------------------------------------------------
#   计划文档写了「可点可面 / 只可用点 / 可用于点线面」的，照写；
#   没写的，按样式表实际支持的图层：
#     minecraft-areas（polygon）、minecraft-points / minecraft-structure-points /
#     minecraft-amenity-points / minecraft-industrial-points / minecraft-redstone-points
#     （point，且 SQL 把闭合面用 ST_PointOnSurface 并进来）、
#     minecraft-portal-lines（linestring）。
#   所以「面也能出图」的键给 ["point","area"]，「线才有图层」的键给 ["line"]。
#
# -----------------------------------------------------------------------------
# 辅助键（area=yes / building=*）为什么没有塞进 tags
# -----------------------------------------------------------------------------
#   计划里对很多结构写了「面元素需要加 area=* / building=*」。这里**不写进 tags**，原因：
#     1. 一个 preset 只有一份 tags，而它同时服务点与面；给点元素塞 area=yes /
#        building=yes 是错的（`area=yes` 挂在 node 上无意义，`building=yes` 挂在 node
#        上会让 iD 把它当成建筑物）。
#     2. `area=yes` iD 会**自动补**：preset 的 geometry 含 area、tags 又不隐含面时，
#        iD 在 setTags() 里自动加 area=yes（iD.js 的 preset.setTags，见
#        modules/presets/preset.js）。所以「面元素需要加 area=*」这条已经被编辑器满足了。
#     3. carto4mc 的 minecraft-*-points 图层都 UNION 了面中心点，所以标注成面照样出图。
#   要 `building=*` 的结构（如 mansion、bastion_remnant），请在地图里用 iD 自带的
#   建筑物字段补一个，或在 tags 里手加 —— 见 README-ID-PRESETS.md 的「设计取舍」。
#
# -----------------------------------------------------------------------------
# icon 只能用 iD 真的有的图标
# -----------------------------------------------------------------------------
#   iD 把 preset.icon 直接当成 SVG sprite 的 symbol id 用（`<use href="#"+icon>`），
#   所以名字必须严格等于某个 sprite 里的 id：`maki-*` / `temaki-*` / `iD-*` /
#   `roentgen-*` / `fas-*`。
#   ⚠️ 文档/老版本 iD 里的裸名字（circle、water、tree、building、factory…）在本版本
#   **不存在**，用了就是一个空图标。
#   合法的名字清单由 `scripts/build_id_minecraft_presets.rb icons` 从容器里的
#   dist/img/*-sprite.svg 抽出来，存 vendor/id-tagging-schema/icon-names.txt，
#   build 时会逐个校验，写错就直接报错退出。
# =============================================================================

meta:
  # 我们的 preset / field id 前缀，合并时用它来识别「自己人」，也用来做重复 id 检查
  id_prefix: "minecraft"
  field_prefix: "minecraft_"
  category_prefix: "category-minecraft-"

  # 基础 schema 的版本。这里写的是 iD 的 package.json 里
  # `"@openstreetmap/id-tagging-schema": "^6.13.4"` 这个 semver 范围在 jsDelivr 上
  # 解析到的实际版本（iD 运行时就是这么解析的，见 iD.js 的 fileStore/config/id.js）。
  # 升级 @openstreetmap/id 之后要重跑 `build_id_minecraft_presets.rb fetch` 换基础文件。
  base_version_range: "^6.13.4"

  # 需要注入中文/英文文案的 tagging 语言包。
  # 为什么必须注入：iD 里 preset 的 name/terms 有 JSON 兜底（我们写了中文它就用中文），
  # 但**分类名、字段名、字段选项名**只认 `_tagging.presets.*` 翻译，没有兜底。
  # 不注入的话分类磁贴会显示成 `category-minecraft-nature`、下拉框显示原始值。
  # 注入是「基础语言包 + 我们的补充」，所以不会丢原有翻译。
  translations:
    - zh-CN
    - zh-TW
    - zh
    - en

# =============================================================================
# 自定义字段（iD 的 field）
# =============================================================================
# type: combo（可下拉可手输）/ text（纯手输）。
# 一个字段 = 一个 minecraft 键，options 就是计划文档里限定/列举的值。
# 中文名走 translations（label + options.<value>），脚本会自动生成。
