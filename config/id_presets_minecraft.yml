# =============================================================================
# 五个类别 —— 对应 iD 预设面板里的分组磁贴
# =============================================================================
# members 不在这里写：脚本按每个 preset 的 category 字段自动汇总（单一事实来源）。
# more_fields 是该类别预设默认的「更多字段」，preset 可以用自己的 more_fields 覆盖。
categories:

  - id: category-minecraft-misc
    name: 杂项
    icon: maki-marker-stroked
    terms: ["minecraft misc", "杂项", "其他"]
    more_fields: [minecraft_addon, minecraft_species, minecraft_genus]

  - id: category-minecraft-nature
    name: 自然类
    icon: maki-natural
    terms: ["minecraft nature", "自然类", "自然", "结构"]
    more_fields: [minecraft_nature, minecraft_addon]

  - id: category-minecraft-infrastructure
    name: 基建类
    icon: maki-town-hall
    terms: ["minecraft infrastructure", "基建类", "基建", "设施", "传送门"]
    more_fields: [minecraft_addon, minecraft_species, minecraft_genus]

  - id: category-minecraft-production
    name: 生产类
    icon: maki-industry
    terms: ["minecraft production", "生产类", "生产", "工业", "机器"]
    more_fields: [minecraft_industrial, minecraft_mob_farm, minecraft_craft, minecraft_product, minecraft_addon]

  - id: category-minecraft-redstone
    name: 红石类
    icon: temaki-power_circuit
    terms: ["minecraft redstone", "红石类", "红石"]
    more_fields: [minecraft_redstone, minecraft_cannon, minecraft_product, minecraft_addon]

# 把我们的分类插进 iD 预设面板的默认列表（preset_defaults），否则用户必须先搜索才能看到。
#   position: before —— 插在 iD 自带分类前面（这个实例是 Minecraft 专用，优先露出）
#   geometries        —— 只插进这些几何的列表；留空表示按成员的几何自动判断
defaults:
  position: before
  geometries: []

# =============================================================================
# 预设本体
# =============================================================================
# 每个 key 是 preset id（iD 用 `/` 表示层级，母级不需要真的存在一个 preset）。
#   name      中文名（来自计划文档）
#   terms     搜索别名（英文 + 中文）
#   icon      必须是合法 sprite id（build 时校验）
#   geometry  point / line / area
#   tags      只写这个预设代表的键值；确实必需的辅助键才加
#   fields    该元素的字段；省略时 = [name] + more_fields
#   more_fields 省略时用所属类别的默认值
presets:

  # ---------------------------------------------------------------------------
  # 杂项
  # ---------------------------------------------------------------------------

  minecraft/general/yes:
    name: Minecraft 相关内容
    terms: ["minecraft", "minecraft yes", "Minecraft 相关内容", "Minecraft"]
    icon: maki-marker-stroked
    geometry: [point, line, area]
    category: category-minecraft-misc
    # 计划：非标准的键，没有其他 minecraft 键值时用来表示是不是 minecraft 相关的内容。
    tags: { "minecraft": "yes" }

  minecraft/addon:
    name: 模组来源
    terms: ["addon", "mod", "模组来源", "模组"]
    icon: temaki-tools
    geometry: [point, line, area]
    category: category-minecraft-misc
    tags: { "minecraft:addon": "minecraft" }

  minecraft/species:
    name: Minecraft 物种
    terms: ["species", "entity", "物种", "实体", "生物"]
    icon: temaki-plant
    geometry: [point, line, area]
    category: category-minecraft-misc
    tags: { "minecraft:species": "*" }

  minecraft/genus:
    name: Minecraft 物种大类
    terms: ["genus", "物种大类", "大类"]
    icon: temaki-tree_broadleaved
    geometry: [point, line, area]
    category: category-minecraft-misc
    tags: { "minecraft:genus": "*" }

  minecraft/block:
    name: 单个方块
    terms: ["block", "方块", "block id"]
    icon: maki-square-stroked
    geometry: [point]
    category: category-minecraft-misc
    tags: { "minecraft:block": "*" }

  minecraft/block/spawner:
    name: 刷怪笼
    terms: ["spawner", "monster spawner", "刷怪笼"]
    icon: temaki-mineshaft_cage
    geometry: [point]
    category: category-minecraft-misc
    tags: { "minecraft:block": "spawner" }

  minecraft/landuse/village:
    name: 村民相关区域
    terms: ["landuse village", "村民区域", "村庄用地"]
    icon: maki-village
    geometry: [area]
    category: category-minecraft-misc
    tags: { "minecraft:landuse": "village" }

  minecraft/landuse/redstone:
    name: 红石电路区域
    terms: ["landuse redstone", "红石电路", "红石区"]
    icon: temaki-power_circuit
    geometry: [area]
    category: category-minecraft-misc
    tags: { "minecraft:landuse": "redstone" }

  minecraft/landuse/mob_switch:
